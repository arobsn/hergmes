[package]
authors = ["Alison Oliveira <arobsn@proton.me>"]
edition = "2024"
name = "hergmes"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hergmes"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9"
blake2 = "0.11.0"
bs58 = "0.5.1"
dotenvy = "0.15"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[features]
# Exposes the `sim` module (SimChain + oracle) to integration tests.
sim = []

[dev-dependencies]
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6.5"
